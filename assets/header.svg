<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f2027"/>
      <stop offset="50%"  stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a0c4ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="12"/>

  <!-- Decorative circuit-line accents -->
  <line x1="0" y1="160" x2="900" y2="160" stroke="#a0c4ff" stroke-width="0.4" stroke-opacity="0.25"/>
  <line x1="0" y1="168" x2="900" y2="168" stroke="#a0c4ff" stroke-width="0.2" stroke-opacity="0.12"/>
  <circle cx="60"  cy="160" r="3" fill="#a0c4ff" fill-opacity="0.4"/>
  <circle cx="840" cy="160" r="3" fill="#a0c4ff" fill-opacity="0.4"/>
  <circle cx="450" cy="160" r="2" fill="#a0c4ff" fill-opacity="0.3"/>

  <!-- Main title -->
  <text
    x="450" y="95"
    font-family="'Segoe UI', 'Arial Black', sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="6"
    text-anchor="middle"
    fill="url(#textGrad)"
    filter="url(#glow)"
  >CodeMaster</text>

  <!-- Subtitle -->
  <text
    x="450" y="138"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="2.5"
    text-anchor="middle"
    fill="#a0c4ff"
    fill-opacity="0.88"
  >C Code Analyzer &amp; Symbol Browser</text>

  <!-- Bottom tagline -->
  <text
    x="450" y="178"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="11.5"
    font-style="italic"
    letter-spacing="1"
    text-anchor="middle"
    fill="#ffffff"
    fill-opacity="0.45"
  >Because your code deserves more than a linter.</text>
</svg>
